[versions]
kmp-maps-compose = "0.6.2"
kotlin = "2.3.21"
compose = "1.11.0"
agp = "9.2.1"
maps-compose = "8.4.0"
# play-services-maps version should match maps-compose transitive dependency:
# maps-compose 8.4.0 -> maps-ktx 6.2.0 -> play-services-maps 20.0.0
play-services-maps = "20.0.0"
google-maps-ios = "10.8.0"
activity-compose = "1.13.0"
androidx-core = "1.18.0"
kermit = "2.1.0"
buildkonfig = "0.18.0"
spmForKmp = "1.9.1"
vanniktechMavenPublish = "0.36.0"

[libraries]
kmp-maps-compose = { module = "io.github.hysonhou:kmp-maps-compose", version.ref = "kmp-maps-compose" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
compose-components-resources = { group = "org.jetbrains.compose.components", name = "components-resources", version.ref = "compose" }
google-maps-compose = { module = "com.google.maps.android:maps-compose", version.ref = "maps-compose" }
play-services-maps = { module = "com.google.android.gms:play-services-maps", version.ref = "play-services-maps" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }
androidx-core = { module = "androidx.core:core", version.ref = "androidx-core" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
androidKmpLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
buildkonfig = { id = "com.codingfeline.buildkonfig", version.ref = "buildkonfig" }
spmForKmp = { id = "io.github.frankois944.spmForKmp", version.ref = "spmForKmp" }
vanniktechMavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktechMavenPublish" }
